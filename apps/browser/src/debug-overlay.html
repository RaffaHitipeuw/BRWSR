<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Overlay</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #ff4500;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .content {
        width: 100%;
        height: 100%;
        background: #ff4500;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      .text {
        color: #ffffff;
        font-size: 24px;
        font-weight: 900;
        text-align: center;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        padding: 20px;
        border: 4px solid #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="text">DEBUG OVERLAY IS ALIVE</div>
    </div>
  </body>
</html>
