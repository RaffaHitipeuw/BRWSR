<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Downloads</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #222;
        font-size: 13px;
      }
      .page { padding: 16px 20px; }
      .title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
      .empty { color: #777; padding: 8px 0; }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      .item:last-child { border-bottom: none; }
      .icon { width: 32px; height: 32px; flex-shrink: 0; background: #f0f0f0; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
      .info { flex: 1; min-width: 0; }
      .filename { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meta { font-size: 11px; color: #888; margin-top: 2px; }
      .status { font-size: 11px; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; }
      .status-downloading { background: #e8f0fe; color: #1a73e8; }
      .status-completed { background: #e6f4ea; color: #1e8e3c; }
      .status-cancelled { background: #fce8e6; color: #c5221f; }
      .status-interrupted { background: #fde7d5; color: #e37400; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="title">Downloads</div>
      <div id="list"></div>
    </div>
    <script>
      (function () {
        var STORE_KEY = "eduos-browser-downloads";
        var list = document.getElementById("list");

        function fmtBytes(b) {
          if (b === 0) return "0 B";
          var k = 1024;
          var sizes = ["B", "KB", "MB", "GB"];
          var i = Math.floor(Math.log(b) / Math.log(k));
          return (b / Math.pow(k, i)).toFixed(1) + " " + sizes[i];
        }

        function fmtTime(ts) {
          if (!ts) return "";
          var d = new Date(ts);
          return d.toLocaleString();
        }

        function render() {
          var raw;
          try { raw = localStorage.getItem(STORE_KEY); } catch (_) { raw = null; }
          var state = raw ? JSON.parse(raw) : null;
          var items = (state && state.state && state.state.items) || [];
          if (items.length === 0) {
            list.innerHTML = '<div class="empty">No downloads yet</div>';
            return;
          }
          var html = "";
          var n = Math.min(items.length, 50);
          for (var i = 0; i < n; i++) {
            var it = items[i];
            var size = fmtBytes(it.totalBytes || 0);
            var time = fmtTime(it.startTime);
            var status = it.status || "unknown";
            var statusLabel = status.charAt(0).toUpperCase() + status.slice(1);
            var statusClass = "status status-" + status;
            html += '<div class="item">' +
              '<div class="icon">&#8595;</div>' +
              '<div class="info">' +
                '<div class="filename">' + (it.fileName || it.url || "?") + '</div>' +
                '<div class="meta">' + size + (time ? " • " + time : "") + '</div>' +
              '</div>' +
              '<div class="' + statusClass + '">' + statusLabel + '</div>' +
            '</div>';
          }
          list.innerHTML = html;
        }

        render();
      })();
    </script>
  </body>
</html>
