<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Window Test</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #00cc44;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .content {
        width: 100%;
        height: 100%;
        background: #00cc44;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Arial, sans-serif;
      }
      .text {
        color: #ffffff;
        font-size: 20px;
        font-weight: 900;
        text-align: center;
        padding: 20px;
        border: 4px solid #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="text">MINIMAL WINDOW ALIVE</div>
    </div>
  </body>
</html>
