[package]
name = "eduos-teacher"
version = "0.1.0"
description = "EduOS Teacher - Classroom Monitoring"
authors = ["EduOS"]
edition = "2021"

[lib]
name = "eduos_teacher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
url = "2"
sysinfo = "0.33"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
